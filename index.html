<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Editor</title>
    <link rel="stylesheet" href="styles.css">

    <script src="Scripts/cssExtractionCode.js"></script>
    <script src="Scripts/setupScripts.js"></script>
    <script src="Scripts/propertyPanelSetupScripts.js"></script>
    <script src="Scripts/eventHandlers.js"></script>
    <script src="Scripts/ctrlManagementScripts.js"></script>
    <script src="Scripts/ctrlPropertyUpdateScripts.js"></script>
    <script src="Scripts/helperScripts.js"></script>
    <script src="Scripts/propertyPanelMgmtScripts.js"></script>
    <script src="Scripts/stateVariables.js"></script>
    <script src="Scripts/ioActionScripts.js"></script>
    <script src="Scripts/tableManagementScripts.js"></script>
    <script src="Scripts/htmlListManagementScripts.js"></script>
    <script src="Scripts/comboBoxManagementScripts.js"></script>
    <script src="Scripts/searchableDropdownMgmtScripts.js"></script>
    <script src="Scripts/actionBarCtrlScripts.js"></script>

    <script>
        // Run when the page is loaded
	document.addEventListener("DOMContentLoaded", async function () {

		// initialize the toolbar & properties panel
		initializePropertiesPanel();
		initializePropertyEditorHandlers();
        	initializeControlCanvas();
		initializeToolbar();

		// event handler registration events
		registerButtonEvents();
		registerKeyboardEvents();

		// load data saved in the browser
		loadBrowserSavedData();
	});
    </script>
</head>

<body>

<div id="overheadBtnBarDiv">
    <div id="tabSelectBtnDiv">
	<button type="button" id="toolbarTabBtn" disabled>Toolbar</button>
	<button type="button" id="itemPropertyTabBtn">Properties</button>
    </div>

    <div id="actionBarDiv">
    	<div id="instructionLblDiv">
		<label id="instructionLbl"></label>
    	</div>
	<div id="overheadBarBtnDiv">
		<button type="button" id="savePageToBrowserBtn" class="ioActionBtns">Save to Browser</button>
		<button type="button" id="savePageToFileBtn" class="ioActionBtns" disabled>Save to File</button>
		<button type="button" id="exportPageBtn" class="ioActionBtns" disabled>Export as Separate Files (HTML/CSS)</button>
		<button type="button" id="loadPageBtn" class="ioActionBtns" >Load Page</button>	
		<button type="button" id="exportElementBtn" class="ioActionBtns" disabled>Export Selected Element</button>
		<button type="button" id="importElementsBtn" class="ioActionBtns">Import HTML Elements</button>
	</div>
    </div>
</div>

<div id="mainPageWrapper">
    <div id="sideBarDiv">
        	<div id="toolbar" class="toolbar">
            		<!-- Control categories are generated here by JavaScript. -->
        	</div>

        	<div id="propertiesPanel" class="properties-panel">
            		<h3>Properties</h3>

			<div id="elementIdentitySection">
        			<!-- Name / ID / Class -->
    			</div>

    			<div id="controlPropertiesScrollArea">
        		<!-- Scrollable properties -->

            			<div id="propertiesContent" class="properties-content">
                			Select a control from the toolbar.
    				</div>
               		</div>
        	</div>
	</div>

    	<main class="main-content">
		<div id="controlCanvas">

		</div>
    	</main>
</div>
